[project]
name = "dp-gs-reproduction"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
  "torch==2.4.1+cu124",
  "torchvision==0.19.1+cu124",
  "einops==0.8.2",
  "faiss-gpu-cu12==1.14.1.post1",
  "huggingface-hub==0.29.3",
  "imageio==2.37.3",
  "mediapy==1.2.7",
  "mmcv-lite==2.2.0",
  "mmengine==0.10.7",
  "numpy==2.2.6",
  "open3d==0.19.0",
  "opencv-python==4.13.0.92",
  "plyfile==1.1.4",
  "scikit-image==0.25.2",
  "scikit-learn==1.7.2",
  "timm==1.0.28",
  "tqdm==4.67.3",
  "trimesh==4.12.2",
  "matplotlib",
  "scipy",
  "Pillow",
  "roma",
  "gradio==4.44.1",
  "pyglet<2",
  "tensorboard",
  "tensorboardX",
  "iopath",
  "pyaml",
  "PyYAML",
  "GPUtil",
  "gdown",
  "setuptools<81",
  "wheel",
  "ninja",
  "Cython<3",
  "ipywidgets>=8.0.4,<9",
]

[project.optional-dependencies]
visualization = [
    "imageio-ffmpeg==0.6.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
